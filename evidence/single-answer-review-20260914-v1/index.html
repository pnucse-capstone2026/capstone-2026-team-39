<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부산대 답변 일치도 검수</title>
<style>
:root{--paper:#f5f7fa;--ink:#1c2838;--navy:#234767;--saved:#167363;--line:#d6e0ea;--warning:#984126}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.6}button,input,select,textarea{font:inherit}button,select,input,textarea{border:1px solid var(--line);border-radius:7px}button{background:white;padding:8px 12px;cursor:pointer;color:var(--navy)}button:hover:not(:disabled){background:#e9eff5}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:var(--navy);color:white}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #6b98b8;outline-offset:2px}input[type=text]{padding:7px;max-width:180px}header{padding:18px 28px 12px;border-bottom:1px solid var(--line);background:white}header h1{font-family:"AppleMyungjo","Batang",serif;font-size:25px;margin:0 0 4px;letter-spacing:-.6px}.sub{color:#52667b;font-size:13px;margin:0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}#status{font-size:13px;color:var(--saved);flex:1;min-width:220px}#status.error{color:var(--warning)}#alert{margin:12px 28px;padding:12px;background:#fff3e8;border:1px solid #e2bca1;border-radius:8px}#alert:empty{display:none}.layout{display:grid;grid-template-columns:100px minmax(0,1fr);gap:20px;padding:20px 28px}nav{position:sticky;top:12px;align-self:start;max-height:90vh;overflow:auto}nav h2{font-size:12px;margin:12px 0 5px}nav .numbers{display:grid;grid-template-columns:1fr 1fr;gap:5px}nav button{font-family:ui-monospace,monospace;font-size:12px;padding:5px 2px}nav .current{outline:2px solid var(--navy);outline-offset:1px}nav .done{background:#e2f2ec;color:var(--saved)}main{min-width:0}.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}.pagehead h2{margin:0;font-size:18px}.columns{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,1fr);gap:18px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:15px}.card h3{font-size:14px;color:var(--navy);margin:0 0 9px}.question{font-size:19px;font-weight:650;margin:0 0 10px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.gold{border-left:3px solid #779ab6;padding:4px 0 4px 13px;margin:14px 0}.gold p{margin:0 0 7px}.quote{color:#485c70;background:var(--paper);padding:10px;font-size:13px;max-height:190px;overflow:auto}.answer{font-size:16px;line-height:1.85;border-left:4px solid var(--navy);padding-left:16px}.contexts{max-height:580px;overflow:auto;padding-right:5px}.context{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 ui-monospace,"Apple SD Gothic Neo",monospace;background:var(--paper);padding:12px;border:1px solid var(--line);border-radius:6px;margin-bottom:12px}.grade{position:sticky;top:12px}.grade fieldset{border:0;padding:0;margin:16px 0}.grade legend{font-weight:650;margin-bottom:7px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:8px 10px}.choice:has(input:checked){background:#e7f0f7;border-color:var(--navy)}.grade label.check{display:block;margin:10px 0;font-size:13px}.grade textarea{width:100%;min-height:76px;padding:10px;resize:vertical}details{margin-top:12px}summary{cursor:pointer;color:var(--navy);font-weight:600}.muted{color:#52667b;font-size:13px}.locked{background:#e2f2ec;border-color:#83b6a4}.footer-actions{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}#history{max-height:170px;overflow:auto;font:12px/1.5 ui-monospace,monospace}.progress{height:4px;background:#e4ecf3;margin-top:12px}.progress span{display:block;background:var(--saved);height:4px}a{color:var(--navy)}@media(max-width:950px){.columns{grid-template-columns:1fr}.grade{position:static}.layout{padding:12px;grid-template-columns:80px minmax(0,1fr);gap:12px}header{padding:16px}.card{padding:15px}}@media(max-width:520px){.layout{display:block}nav{position:static;max-height:130px;margin-bottom:15px}nav .numbers{grid-template-columns:repeat(8,1fr)}.toolbar{gap:8px}.pagehead{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><h1>답변을 보고, 근거로 판정하기</h1><p class="sub">부산대 문서 챗봇 · 사람 1인–Judge 일치도 검증 · 조건명과 개별 Judge 판정은 숨겨져 있습니다.</p>
<div class="toolbar"><label>검수자 이름/별칭 <input id="reviewer" type="text" maxlength="120" placeholder="직접 입력"></label><span id="status" role="status" aria-live="polite">저장 상태 확인 중…</span><button id="export">검토결과 내려받기</button><button id="localExport">브라우저 초안 백업</button><button id="historyButton">저장 이력</button></div><div class="progress"><span id="bar"></span></div><div id="history" hidden></div></header>
<div id="alert" role="alert"></div><div class="layout"><nav id="nav" aria-label="답변 선택"></nav><main id="main"><p>답변과 저장된 검수를 불러오고 있습니다.</p></main></div><script src="/app.js"></script></body></html>
